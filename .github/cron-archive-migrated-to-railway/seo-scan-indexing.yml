name: SEO URL Inspection scan

on:
  schedule:
    # Daily ~ 11:00 UTC — adjust as needed (GitHub Actions cron is UTC).
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  scan-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run URL Inspection workers (pending + submitted)
        env:
          SITE_URL: https://scholarshiptop.com
          GOOGLE_INDEXING_SECRET: ${{ secrets.GOOGLE_INDEXING_SECRET }}
        run: |
          if [ -z "$GOOGLE_INDEXING_SECRET" ]; then
            echo "Missing required GitHub secret: GOOGLE_INDEXING_SECRET" >&2
            exit 1
          fi

          run_one() {
            local path="$1"
            local label="$2"
            local response_file
            response_file="$(mktemp)"
            local http_code
            http_code="$(
              curl \
                --silent \
                --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST \
                --url "${SITE_URL}${path}" \
                --header "Authorization: Bearer ${GOOGLE_INDEXING_SECRET}" \
                --header "Content-Type: application/json"
            )"
            echo "--- ${label} ---"
            cat "$response_file"
            echo ""
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "${label} failed with HTTP ${http_code}" >&2
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
          }

          run_one "/api/internal/seo/check-index-worker" "check-index-worker (pending)"
          run_one "/api/internal/seo/scan-indexing" "scan-indexing (submitted)"
