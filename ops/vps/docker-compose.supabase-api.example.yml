# Stage 4A scaffold — GoTrue + PostgREST on VPS (NOT production).
#
# Purpose: isolated test stack for Stage 4B smoke against restored Postgres.
# Does NOT modify scholarshiptop-site, parsers, or hosted Supabase.
#
# Usage (VPS, after Stage 3 restore):
#   cp ops/env/supabase-api.env.example /opt/scholarshiptop/env/supabase-api.env
#   # fill secrets on VPS only (JWT_SECRET, DB URLs, OAuth, keys)
#   docker compose -f ops/vps/docker-compose.supabase-api.example.yml --profile supabase-api-test up -d
#
# Smoke:
#   bash scripts/vps-migration/stage4a-selfhost-smoke-plan.sh --internal
#
# Teardown:
#   docker compose -f ops/vps/docker-compose.supabase-api.example.yml --profile supabase-api-test down

name: scholarshiptop-supabase-api

services:
  gotrue:
    profiles: ["supabase-api-test"]
    image: supabase/gotrue:v2.171.0
    container_name: scholarshiptop-gotrue-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    env_file:
      - ./env/supabase-api.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      PORT: "9999"
      API_EXTERNAL_URL: ${SELFHOST_API_BASE_URL:-http://127.0.0.1:54321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgrest:
    profiles: ["supabase-api-test"]
    image: postgrest/postgrest:v12.2.8
    container_name: scholarshiptop-postgrest-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./env/supabase-api.env
    environment:
      PGRST_DB_URI: ${POSTGREST_DB_URI}
      PGRST_DB_SCHEMAS: ${POSTGREST_DB_SCHEMAS:-public,storage}
      PGRST_DB_ANON_ROLE: ${POSTGREST_DB_ANON_ROLE:-anon}
      PGRST_DB_EXTRA_SEARCH_PATH: ${POSTGREST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${SELFHOST_API_BASE_URL:-http://127.0.0.1:54321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gotrue:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Optional nginx front for supabase-js-compatible paths (/auth/v1, /rest/v1)
  supabase-api-gateway:
    profiles: ["supabase-api-test"]
    image: nginx:1.27-alpine
    container_name: scholarshiptop-supabase-api-gateway-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:54321:8080"
    volumes:
      - ./nginx/includes/scholarshiptop-supabase-api-locations.example.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gotrue
      - postgrest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
