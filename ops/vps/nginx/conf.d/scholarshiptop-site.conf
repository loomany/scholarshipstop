# Nginx reverse proxy — VPS origin behind Cloudflare Full (strict).
# TLS: Cloudflare Origin Certificate mounted from /etc/nginx/secrets (read-only).

upstream scholarshiptop_site {
  server site:3000;
  keepalive 16;
}

# HTTP → HTTPS for production hostnames only (IP :80 stays for staging smoke).
server {
  listen 80;
  listen [::]:80;
  server_name scholarshiptop.com www.scholarshiptop.com;
  return 301 https://$host$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  access_log /var/log/nginx/scholarshiptop-access.log;
  error_log /var/log/nginx/scholarshiptop-error.log warn;

  client_max_body_size 20m;

  include /etc/nginx/includes/scholarshiptop-proxy-locations.conf;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name scholarshiptop.com www.scholarshiptop.com;

  ssl_certificate     /etc/nginx/secrets/cloudflare-origin.pem;
  ssl_certificate_key /etc/nginx/secrets/cloudflare-origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log /var/log/nginx/scholarshiptop-access.log;
  error_log /var/log/nginx/scholarshiptop-error.log warn;

  client_max_body_size 20m;

  include /etc/nginx/includes/scholarshiptop-proxy-locations.conf;
}
