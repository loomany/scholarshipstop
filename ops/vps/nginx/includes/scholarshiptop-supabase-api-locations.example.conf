# Stage 4A — nginx reverse proxy for self-hosted Supabase-compatible API (TEST ONLY).
# Mount in supabase-api-gateway container OR add to VPS nginx for api-test subdomain.
# Binds localhost:54321 in docker-compose.supabase-api.example.yml
#
# supabase-js expects:
#   {SUPABASE_URL}/auth/v1/*     → GoTrue
#   {SUPABASE_URL}/rest/v1/*     → PostgREST
#   {SUPABASE_URL}/storage/v1/*  → Storage API (NOT in Stage 4A stack — hybrid CDN)

upstream scholarshiptop_gotrue_test {
  server host.docker.internal:9999;
  keepalive 8;
}

upstream scholarshiptop_postgrest_test {
  server host.docker.internal:3001;
  keepalive 8;
}

server {
  listen 8080;
  server_name _;

  access_log /var/log/nginx/supabase-api-access.log;
  error_log /var/log/nginx/supabase-api-error.log warn;

  client_max_body_size 20m;

  # GoTrue Auth API
  location /auth/v1/ {
    proxy_pass http://scholarshiptop_gotrue_test/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PostgREST (RLS-aware REST)
  location /rest/v1/ {
    proxy_pass http://scholarshiptop_postgrest_test/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass JWT from client (anon key or user access token)
    proxy_set_header Authorization $http_authorization;
  }

  # Storage — Stage 4A: NOT proxied (hybrid Supabase Storage or future MinIO)
  location /storage/v1/ {
    return 503 '{"message":"Storage API not deployed in Stage 4A test stack. Use hybrid Supabase CDN."}';
    add_header Content-Type application/json;
  }

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
