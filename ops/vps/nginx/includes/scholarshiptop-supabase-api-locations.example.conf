# Stage 4A — nginx reverse proxy for self-hosted Supabase-compatible API (TEST ONLY).
# Mount in supabase-api-gateway container OR add to VPS nginx for api-test subdomain.
# Binds localhost:54321 in docker-compose.supabase-api.example.yml
#
# supabase-js expects:
#   {SUPABASE_URL}/auth/v1/*     → GoTrue
#   {SUPABASE_URL}/rest/v1/*     → PostgREST
#   {SUPABASE_URL}/storage/v1/*  → Storage API (NOT in Stage 4A stack — hybrid CDN)

# Docker embedded DNS — defer upstream resolution so gateway starts when upstreams restart.
resolver 127.0.0.11 ipv6=off valid=30s;

server {
  listen 8080;
  server_name _;

  access_log /var/log/nginx/supabase-api-access.log;
  error_log /var/log/nginx/supabase-api-error.log warn;

  client_max_body_size 20m;

  # GoTrue Auth API (variable proxy_pass — starts even if gotrue container is restarting)
  location /auth/v1/ {
    # Shadow/staging rehearsal CORS — localhost ports only (not production public API).
    set $rehearsal_cors_origin "";
    if ($http_origin ~* "^http://127\.0\.0\.1:(3100|3101)$") {
      set $rehearsal_cors_origin $http_origin;
    }
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $rehearsal_cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, X-Supabase-Api-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }
    add_header Access-Control-Allow-Origin $rehearsal_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "X-Total-Count" always;

    set $gotrue_upstream gotrue:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_pass http://$gotrue_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PostgREST (RLS-aware REST) — variable upstream survives container restarts
  location /rest/v1/ {
    set $postgrest_upstream postgrest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://$postgrest_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Storage — Stage 4A: NOT proxied (hybrid Supabase Storage or future MinIO)
  location /storage/v1/ {
    return 503 '{"message":"Storage API not deployed in Stage 4A test stack. Use hybrid Supabase CDN."}';
    add_header Content-Type application/json;
  }

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
