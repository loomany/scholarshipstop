# Stage 5C — production-ready, no-Basic-Auth route for the self-host Supabase API.
#
# Included by scholarshiptop-site.conf (both :80 default_server and :443).
# IMPORTANT: adding this route does NOT switch the production site. The Next.js
# app still talks to hosted Supabase via its baked NEXT_PUBLIC_SUPABASE_URL.
# After a real cutover, set NEXT_PUBLIC_SUPABASE_URL to:
#     https://scholarshiptop.com/supabase
# supabase-js then calls:
#     https://scholarshiptop.com/supabase/auth/v1/*     -> GoTrue
#     https://scholarshiptop.com/supabase/rest/v1/*      -> PostgREST
#     https://scholarshiptop.com/supabase/storage/v1/*   -> hybrid (hosted CDN) 503 here
#
# Security: NO Basic Auth. Data is protected by Postgres RLS + JWT (anon/service_role),
# the same posture as the hosted Supabase anon endpoint. CORS is restricted to the
# production web origins only. Proxies to the self-host gateway over the docker network.

# Docker embedded DNS: resolve gateway at request time so the route survives
# gateway container restarts without a production nginx reload.
resolver 127.0.0.11 ipv6=off valid=30s;

# --- GoTrue Auth API ---------------------------------------------------------
location ^~ /supabase/auth/v1/ {
  set $st_api_cors "";
  if ($http_origin ~* "^https://(www\.)?scholarshiptop\.com$") {
    set $st_api_cors $http_origin;
  }
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $st_api_cors always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, X-Supabase-Api-Version" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    return 204;
  }
  add_header Access-Control-Allow-Origin $st_api_cors always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Expose-Headers "Content-Range, X-Total-Count" always;

  set $st_supabase_gw scholarshiptop-supabase-api-gateway-test:8080;
  rewrite ^/supabase/(.*)$ /$1 break;
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_pass http://$st_supabase_gw;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# --- PostgREST REST API ------------------------------------------------------
location ^~ /supabase/rest/v1/ {
  set $st_api_cors "";
  if ($http_origin ~* "^https://(www\.)?scholarshiptop\.com$") {
    set $st_api_cors $http_origin;
  }
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $st_api_cors always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, X-Supabase-Api-Version, Prefer, Range" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    return 204;
  }
  add_header Access-Control-Allow-Origin $st_api_cors always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Expose-Headers "Content-Range, X-Total-Count" always;

  set $st_supabase_gw scholarshiptop-supabase-api-gateway-test:8080;
  rewrite ^/supabase/(.*)$ /$1 break;
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_pass http://$st_supabase_gw;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_read_timeout 60s;
}

# --- Storage — hybrid (served by hosted Supabase CDN, not self-host) ---------
location ^~ /supabase/storage/v1/ {
  default_type application/json;
  add_header Content-Type application/json always;
  return 503 '{"message":"Storage API hybrid: assets are served by the hosted Supabase CDN, not the self-host stack."}';
}

# --- Gateway health passthrough ----------------------------------------------
location = /supabase/health {
  set $st_supabase_gw scholarshiptop-supabase-api-gateway-test:8080;
  rewrite ^/supabase/(.*)$ /$1 break;
  proxy_pass http://$st_supabase_gw;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}
