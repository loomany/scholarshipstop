add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
add_header Strict-Transport-Security "max-age=86400" always;

# Observe violations before enforcing CSP. Review reports/browser console after deploy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.googletagmanager.com https://assets.lemonsqueezy.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.lemonsqueezy.com https://www.google-analytics.com https://www.googletagmanager.com https://*.google.com; frame-src 'self' https://www.youtube-nocookie.com https://app.lemonsqueezy.com https://checkout.lemonsqueezy.com; worker-src 'self' blob:; form-action 'self' https://*.lemonsqueezy.com" always;
